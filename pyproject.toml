[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hangeul-python"
version = "0.1.0a2"
description = "파이썬의 문법과 API를 한국어로 쓰는 한글 파이썬"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
authors = [{name = "Sungrok Park"}]
keywords = ["korean", "hangul", "python", "transpiler", "한글", "프로그래밍"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Natural Language :: Korean",
]

[project.urls]
Repository = "https://github.com/gamparda/hangeul-python"
Issues = "https://github.com/gamparda/hangeul-python/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "ruff>=0.11"]
data = ["numpy>=2", "pandas>=2.2"]

[project.scripts]
hangeul = "hangeul_python.cli:main"
"한글파이썬" = "hangeul_python.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hangeul_python = ["data/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
